<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Генератор иконок</title></head>
<body style="font-family: sans-serif; text-align: center; padding: 50px; background: #F4F5F7;">
    <h2>Генерация иконок для PWA</h2>
    <p>Нажмите на кнопки ниже, чтобы скачать готовые PNG-файлы.</p>
    <button onclick="downloadIcon(180, 'apple-touch-icon.png')" style="padding: 15px; margin: 5px; background: #000; color: #D4FF00; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;">Скачать для iPhone (180x180)</button>
    <br>
    <button onclick="downloadIcon(192, 'icon-192.png')" style="padding: 15px; margin: 5px; background: #000; color: #D4FF00; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;">Скачать Android (192x192)</button>
    <br>
    <button onclick="downloadIcon(512, 'icon-512.png')" style="padding: 15px; margin: 5px; background: #000; color: #D4FF00; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;">Скачать Android (512x512)</button>

    <script>
        function downloadIcon(size, filename) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Рисуем скругленный черный квадрат (как на картинке)
            const radius = size * 0.22; // Закругление углов
            ctx.fillStyle = '#111111';
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fill();

            // Масштабируем график
            const scale = size / 512;
            ctx.save();
            ctx.scale(scale, scale);

            // Рисуем 3 столбика (лаймовый #D4FF00)
            ctx.fillStyle = '#D4FF00';
            
            // 1 столбик
            ctx.beginPath(); ctx.roundRect(140, 280, 40, 80, 10); ctx.fill();
            // 2 столбик
            ctx.beginPath(); ctx.roundRect(200, 230, 40, 130, 10); ctx.fill();
            // 3 столбик
            ctx.beginPath(); ctx.roundRect(260, 170, 40, 190, 10); ctx.fill();

            // Рисуем белую стрелку
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(150, 200);
            ctx.lineTo(230, 130);
            ctx.lineTo(280, 180);
            ctx.lineTo(365, 90);
            ctx.stroke();

            // Наконечник стрелки
            ctx.beginPath();
            ctx.moveTo(330, 90);
            ctx.lineTo(365, 90);
            ctx.lineTo(365, 125);
            ctx.stroke();

            // Лаймовая точка на конце стрелки
            ctx.fillStyle = '#D4FF00';
            ctx.beginPath();
            ctx.arc(365, 90, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Скачиваем
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
